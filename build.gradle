plugins {
	id 'java'
	id 'application'
	//TODO: Upgrade sprint-boot to 3.x
	id 'org.springframework.boot' version '2.7.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vigilantebackendservice'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// TODO: Upgrade Java to 17
		languageVersion = JavaLanguageVersion.of(11)
	}
}

repositories {
	mavenCentral()
	gradlePluginPortal()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation "org.springframework.boot:spring-boot-gradle-plugin:2.7.1"
	implementation 'org.jsoup:jsoup:1.18.3'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

application {
	mainClass = 'com.vigilantebackendservice.VigilanteBackendService.VigilanteBackendServiceApplication'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootRun {
	jvmArgs = ["-Dspring.devtools.restart.enabled=true"]
}
